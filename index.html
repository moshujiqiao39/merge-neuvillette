<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071421" />
  <title>合成那维莱特</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23143858'/%3E%3Ccircle cx='50' cy='50' r='28' fill='%23e6d2a2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div class="title-block">
        <p class="eyebrow">枫丹合成试验</p>
        <h1>合成那维莱特</h1>
      </div>
      <div class="scores" aria-live="polite">
        <div><span>得分</span><strong id="score">0</strong></div>
        <div><span>最高</span><strong id="best">0</strong></div>
      </div>
    </header>

    <section class="stage" aria-label="游戏区域">
      <canvas id="board" width="420" height="700"></canvas>
      <div id="start" class="mask">
        <div class="card">
          <h2>合成那维莱特</h2>
          <p>相同的两个碰到一起，就会变成更大的一个。上面只会落下前五种，一直合成到最大。</p>
          <button id="start-btn" class="primary" type="button">开始</button>
          <p class="tiny">移动瞄准，点击落下。手机上按住拖动，松手落下。圆停在警戒线上方，审判就结束。</p>
        </div>
      </div>
      <div id="over" class="mask hidden">
        <div class="card">
          <h2 id="over-title">审判结束</h2>
          <p id="over-score" class="big-score">0</p>
          <p id="over-detail"></p>
          <button id="again-btn" class="primary" type="button">再来一局</button>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="next-box">
        <span>下一位</span>
        <div id="next-face" class="face"></div>
      </div>
      <p id="hint" class="hint">移动瞄准，点击或按空格落下</p>
      <div class="actions">
        <button id="sound-btn" type="button">声音：开</button>
        <button id="restart-btn" type="button">重新开始</button>
      </div>
      <details id="chain-wrap" class="chain-wrap">
        <summary>合成顺序</summary>
        <div id="chain" class="chain"></div>
      </details>
    </aside>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
